[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32@6.13.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
extra_scripts =
    post:scripts/merge_factory.py
lib_deps =
    m5stack/M5Unified@0.2.19

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<protocol/CpuMessage.cpp>
    +<protocol/AgentStatusMessage.cpp>
    +<app/CompanionState.cpp>
