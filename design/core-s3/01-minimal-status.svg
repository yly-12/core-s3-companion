<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Minimal Status — Claude is running</title>
  <desc id="desc">A two-inch Claude status display showing the conversation title, running state, five-hour and weekly quota, context usage, and battery.</desc>
  <defs>
    <style>
      .ui { font-family: Silkscreen, Monaco, monospace; }
      .meta { font-size: 11px; letter-spacing: .4px; }
      .title { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
      .state { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
      .value { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect width="320" height="240" fill="#000000"/>
  <text x="16" y="23" class="ui meta" fill="#7C8782">CLAUDE</text>
  <text x="304" y="23" class="ui meta" text-anchor="end" fill="#F2F5F3">BAT 83%</text>
  <path d="M16 34h288" stroke="#173128"/>
  <text x="16" y="57" class="ui title" fill="#F2F5F3">CORES3 STATUS UI</text>
  <rect x="16" y="77" width="8" height="48" fill="#46F59A"/>
  <text x="40" y="117" class="ui state" fill="#46F59A">RUN</text>
  <text x="202" y="116" class="ui meta" fill="#7C8782">WORKING</text>
  <path d="M16 144h288" stroke="#173128"/>
  <g class="ui">
    <text x="16" y="168" class="value" fill="#F2F5F3">5H 68%</text>
    <rect x="16" y="178" width="86" height="6" fill="#173128"/><rect x="16" y="178" width="58" height="6" fill="#46F59A"/>
    <text x="117" y="168" class="value" fill="#F2F5F3">WK 42%</text>
    <rect x="117" y="178" width="86" height="6" fill="#173128"/><rect x="117" y="178" width="36" height="6" fill="#46F59A"/>
    <text x="218" y="168" class="value" fill="#F2F5F3">CTX 61%</text>
    <rect x="218" y="178" width="86" height="6" fill="#173128"/><rect x="218" y="178" width="52" height="6" fill="#FFC857"/>
  </g>
  <rect x="16" y="211" width="7" height="7" fill="#46F59A"/>
  <text x="34" y="219" class="ui meta" fill="#46F59A">LIVE</text>
  <text x="304" y="219" class="ui meta" text-anchor="end" fill="#7C8782">01S</text>
</svg>

