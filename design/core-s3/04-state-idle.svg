  <g class="ui"><text x="16" y="168" class="value" fill="#F2F5F3">5H 68%</text><rect x="16" y="178" width="86" height="6" fill="#173128"/><rect x="16" y="178" width="58" height="6" fill="#7C8782"/><text x="117" y="168" class="value" fill="#F2F5F3">WK 42%</text><rect x="117" y="178" width="86" height="6" fill="#173128"/><rect x="117" y="178" width="36" height="6" fill="#7C8782"/><text x="218" y="168" class="value" fill="#F2F5F3">CTX 12%</text><rect x="218" y="178" width="86" height="6" fill="#173128"/><rect x="218" y="178" width="10" height="6" fill="#7C8782"/></g>
  <rect x="16" y="211" width="7" height="7" fill="#7C8782"/><text x="34" y="219" class="ui meta" fill="#7C8782">STANDBY</text><text x="304" y="219" class="ui meta" text-anchor="end" fill="#7C8782">SYNC</text>
