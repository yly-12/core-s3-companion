<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Claude state — idle</title>
  <desc id="desc">Claude is idle. The screen includes one state label, quota reset countdowns, context usage, and a battery that is charging.</desc>
  <defs><style>.ui{font-family:Silkscreen,Monaco,monospace}.meta{font-size:11px;letter-spacing:.4px}.title{font-size:14px;font-weight:700}.state{font-size:36px;font-weight:700;letter-spacing:2px}.value{font-size:12px;font-weight:700}</style></defs>
  <rect width="320" height="240" fill="#000000"/>
  <text x="16" y="23" class="ui meta" fill="#7C8782">CLAUDE</text><text x="304" y="23" class="ui meta" text-anchor="end" fill="#46F59A" aria-label="Battery 83 percent, charging">BAT 83%</text>
  <path d="M16 34h288" stroke="#173128"/><text x="16" y="57" class="ui title" fill="#F2F5F3">NEW DISPLAY IDEAS</text>
  <rect x="16" y="77" width="8" height="48" fill="#7C8782"/><text x="40" y="117" class="ui state" fill="#7C8782">IDLE</text>
  <image x="256" y="77" width="48" height="48" href="data:image/png;base64," style="image-rendering:pixelated" aria-label="idle status animation preview"/>
  <path d="M16 144h288" stroke="#173128"/>
  <g class="ui"><text x="16" y="168" class="value" fill="#F2F5F3">5H 68%</text><rect x="16" y="178" width="86" height="6" fill="#173128"/><rect x="16" y="178" width="58" height="6" fill="#7C8782"/><text x="16" y="201" class="meta" fill="#7C8782">2H14m</text><text x="117" y="168" class="value" fill="#F2F5F3">WK 42%</text><rect x="117" y="178" width="86" height="6" fill="#173128"/><rect x="117" y="178" width="36" height="6" fill="#7C8782"/><text x="117" y="201" class="meta" fill="#7C8782">3D8H</text><text x="218" y="168" class="value" fill="#F2F5F3">CTX 12%</text><rect x="218" y="178" width="86" height="6" fill="#173128"/><rect x="218" y="178" width="10" height="6" fill="#7C8782"/><text x="218" y="201" class="meta" fill="#7C8782">SESSION</text></g>
  <text x="16" y="219" class="ui meta" fill="#F2F5F3">OPUS 4.7</text><text x="304" y="219" class="ui meta" text-anchor="end" fill="#7C8782">EFF XHIGH</text>
</svg>
