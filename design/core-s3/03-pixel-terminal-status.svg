<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Pixel Terminal Status — Claude is running</title>
  <desc id="desc">A retro terminal-style Claude status screen with one running-state label, conversation, quota reset countdowns, context, and charging battery information.</desc>
  <defs>
    <style>
      .ui { font-family: Silkscreen, Monaco, monospace; }
      .meta { font-size: 11px; letter-spacing: .25px; }
      .title { font-size: 14px; font-weight: 700; }
      .state { font-size: 30px; font-weight: 700; letter-spacing: 1px; }
      .metric { font-size: 12px; font-weight: 700; }
    </style>
    <pattern id="scan" width="1" height="5" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#173128" opacity=".42"/></pattern>
  </defs>
  <rect width="320" height="240" fill="#000000"/>
  <rect width="320" height="240" fill="url(#scan)"/>
  <rect x="10" y="10" width="300" height="220" fill="none" stroke="#173128" stroke-width="2"/>
  <path d="M10 40h300M10 195h300" stroke="#173128"/>
  <rect x="20" y="21" width="7" height="7" fill="#46F59A"/>
  <text x="38" y="29" class="ui meta" fill="#46F59A">CLAUDE / SESSION</text>
  <text x="300" y="29" class="ui meta" text-anchor="end" fill="#46F59A" aria-label="Battery 83 percent, charging">B83</text>
  <text x="22" y="64" class="ui title" fill="#F2F5F3">CORES3 STATUS UI</text>
  <text x="22" y="105" class="ui state" fill="#46F59A">&gt; RUNNING</text>
  <path d="M22 143h276" stroke="#173128"/>
  <g class="ui">
    <text x="22" y="169" class="metric" fill="#F2F5F3">5H 68%</text>
    <text x="116" y="169" class="metric" fill="#F2F5F3">WK 42%</text>
    <text x="212" y="169" class="metric" fill="#FFC857">CTX 61%</text>
    <text x="22" y="186" class="meta" fill="#7C8782">2H14m</text>
    <text x="116" y="186" class="meta" fill="#7C8782">3D8H</text>
    <text x="212" y="186" class="meta" fill="#7C8782">SESSION</text>
  </g>
  <text x="22" y="219" class="ui metric" fill="#F2F5F3">OPUS 4.7</text>
  <text x="300" y="219" class="ui meta" text-anchor="end" fill="#7C8782">EFF XHIGH</text>
</svg>
