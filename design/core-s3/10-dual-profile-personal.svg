<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Dual-profile Codex status — Personal account running</title>
  <desc id="desc">The first of two rotating main-screen states. The Personal Codex profile is running, with profile-specific quota, context, model, and effort information.</desc>
  <defs>
    <style>
      .ui { font-family: Silkscreen, Monaco, monospace; }
      .meta { font-size: 11px; letter-spacing: .4px; }
      .badge { font-size: 9px; font-weight: 700; letter-spacing: .2px; }
      .title { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
      .state { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
      .value { font-size: 12px; font-weight: 700; }
    </style>
  </defs>
  <rect width="320" height="240" fill="#000000"/>

  <text x="16" y="23" class="ui meta" fill="#10A37F">CODEX</text>
  <rect x="63" y="7" width="66" height="20" rx="2" fill="#0A1824" stroke="#58A6FF"/>
  <text x="96" y="21" class="ui badge" text-anchor="middle" fill="#58A6FF">PERSONAL</text>
  <text x="238" y="23" class="ui badge" text-anchor="end" fill="#7C8782">ACTIVE 1/2</text>
  <text x="304" y="23" class="ui meta" text-anchor="end" fill="#46F59A" aria-label="Battery 83 percent, charging">BAT 83%</text>
  <path d="M16 34h288" stroke="#173128"/>

  <text x="16" y="57" class="ui title" fill="#F2F5F3">CORES3 PROFILE SUPPORT</text>
  <rect x="16" y="77" width="8" height="48" fill="#46F59A"/>
  <text x="40" y="117" class="ui state" fill="#46F59A">RUNNING</text>
  <image x="256" y="77" width="48" height="48" href="data:image/png;base64," style="image-rendering:pixelated" aria-label="running status animation preview"/>

  <path d="M16 144h288" stroke="#173128"/>
  <g class="ui">
    <text x="16" y="168" class="value" fill="#F2F5F3">5H 68%</text>
    <rect x="16" y="178" width="86" height="6" fill="#173128"/>
    <rect x="16" y="178" width="58" height="6" fill="#46F59A"/>
    <text x="16" y="201" class="meta" fill="#7C8782">2H14m</text>

    <text x="117" y="168" class="value" fill="#F2F5F3">WK 42%</text>
    <rect x="117" y="178" width="86" height="6" fill="#173128"/>
    <rect x="117" y="178" width="36" height="6" fill="#46F59A"/>
    <text x="117" y="201" class="meta" fill="#7C8782">3D8H</text>

    <text x="218" y="168" class="value" fill="#F2F5F3">CTX 61%</text>
    <rect x="218" y="178" width="86" height="6" fill="#173128"/>
    <rect x="218" y="178" width="52" height="6" fill="#FFC857"/>
    <text x="218" y="201" class="meta" fill="#7C8782">SESSION</text>
  </g>

  <text x="16" y="219" class="ui meta" fill="#F2F5F3">GPT-6-ASTRA</text>
  <text x="304" y="219" class="ui meta" text-anchor="end" fill="#7C8782">EFF HIGH</text>
</svg>
